<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FITARO — AI Suit Try-On</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="wrap"><header><div class="logo">FITARO</div><div class="tag">جرّب البدلة بالذكاء الاصطناعي</div></header>
<main class="layout">
<section class="card"><h2>صورتك وبياناتك</h2><div class="photo"><img id="preview"><label class="upload">📷 ارفع صورتك<input id="person" type="file" accept="image/jpeg,image/png,image/webp"></label></div>
<label>الطول (سم)</label><input id="height" type="number" value="180"><label>الوزن (كجم)</label><input id="weight" type="number" value="82"><label>الجنس</label><select id="gender"><option value="men">رجل</option><option value="women">امرأة</option></select><label>المناسبة</label><select id="occasion"><option value="wedding">فرح / زفاف</option><option value="engagement">خطوبة</option><option value="work">عمل</option><option value="formal">مناسبة رسمية</option></select></section>
<section class="card"><h2>اختر بدلة</h2><div id="suits" class="suits"></div><div class="actions"><button id="recommend" class="black">✨ اقترح لي</button><button id="tryon" class="gold">👔 جرّب البدلة</button></div><div id="rec" class="rec hidden"></div><div id="error" class="error hidden"></div></section>
<section class="card"><h2>نتيجة التجربة</h2><div id="loading" class="loading hidden"><div class="spin"></div><b>بنجهز البدلة عليك...</b><small>انتظر لحد ما الذكاء الاصطناعي يخلص.</small></div><div id="empty" class="muted">هنا هتظهر الصورة الجديدة.</div><img id="result" class="result hidden"><button id="again" class="gold hidden full">↻ تجربة بدلة أخرى</button></section>
</main>
<section class="card chat"><h2>🤖 FITARO AI Assistant</h2><div id="messages" class="messages"><div class="bubble ai">أهلاً بيك 👋 اسألني عن البدلة أو المقاس أو اللون أو الـFit.</div></div><div class="chatbar"><input id="question" placeholder="مثلاً: طولي 180 ووزني 82 وعندي فرح، ألبس إيه؟"><button id="send" class="black">إرسال</button></div></section></div>
<script src="data/products.js"></script><script src="js/app.js"></script></body></html>
